name: Update Knowledge Graph

on:
  push:
    branches: [develop, main]
    # Avoid an infinite loop: the graph-update PR only touches graphify-out/,
    # so merging it must not re-trigger this workflow. (A push that also changes
    # code outside graphify-out/ still runs.)
    paths-ignore:
      - 'graphify-out/**'

jobs:
  update-graph:
    name: Update Knowledge Graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install graphify
        run: pip install "graphifyy[anthropic]" -q

      - name: Update graph
        run: graphify extract . --backend claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # develop/main are protected (required status checks), so a direct bot push
      # is rejected. Open/refresh a PR instead — it runs the required checks and
      # can be merged. Because it only changes graphify-out/, the merge won't
      # re-trigger this workflow (see paths-ignore above).
      - name: Open knowledge-graph update PR
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          branch: auto/update-knowledge-graph-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          commit-message: "chore: update knowledge graph"
          title: "chore: update knowledge graph"
          body: |
            Automated knowledge-graph refresh from `${{ github.ref_name }}`.

            Regenerated by the **Update Knowledge Graph** workflow (`graphify extract --backend claude`).
            Only `graphify-out/graph.json` and `graphify-out/GRAPH_REPORT.md` change.
          delete-branch: true

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        run: gh pr merge --auto --merge "${{ steps.create-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
