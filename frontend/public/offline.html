<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – SDLC Orchestrator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0c0a09;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      background: #7c3aed;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
    }
    .logo svg { width: 32px; height: 32px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #f5f5f5; }
    p { font-size: 0.9rem; color: #737373; line-height: 1.6; max-width: 320px; margin: 0 auto 2rem; }
    button {
      background: #7c3aed; color: #fff;
      border: none; border-radius: 10px;
      padding: 0.75rem 1.75rem;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: #6d28d9; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <div class="logo">
    <svg fill="none" viewBox="0 0 24 24" stroke="#c4b5fd" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>No internet connection. Check your network and try again — your projects are waiting.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
